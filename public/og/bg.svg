<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%" fill="none">
  <!-- Dark Tech Background Layer -->
  <rect width="800" height="450" fill="#0a0b0f"/>
  
  <!-- Grid Network Overlay -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#2a2d38" stroke-width="1" opacity="0.3"/>
    </pattern>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#22d3a0" stop-opacity="0.2"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#grid)"/>
  
  <!-- Background Ambient Vector Flares -->
  <circle cx="400" cy="225" r="200" fill="#00d4ff" opacity="0.04" filter="blur(80px)"/>
  <circle cx="650" cy="100" r="150" fill="#ff2056" opacity="0.03" filter="blur(60px)"/>

  <!-- Mock Application Interface Frame -->
  <rect x="100" y="60" width="600" height="330" rx="12" fill="#111318" stroke="#2a2d38" stroke-width="2"/>
  
  <!-- Window Header Bar -->
  <path d="M100 100h600" stroke="#2a2d38" stroke-width="2"/>
  <circle cx="125" cy="80" r="5" fill="#ef4444"/>
  <circle cx="145" cy="80" r="5" fill="#f5a524"/>
  <circle cx="165" cy="80" r="5" fill="#22d3a0"/>
  <rect x="250" y="72" width="300" height="16" rx="8" fill="#1a1d26"/>

  <!-- Analytics Simulation Component Left: Gauge Meter -->
  <circle cx="240" cy="240" r="70" stroke="#1a1d26" stroke-width="14" fill="none"/>
  <circle cx="240" cy="240" r="70" stroke="url(#neonGlow)" stroke-width="14" stroke-dasharray="320 440" stroke-linecap="round" fill="none" transform="rotate(-90 240 240)"/>
  <text x="240" y="235" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="28" font-weight="bold">12%</text>
  <text x="240" y="260" text-anchor="middle" fill="#00d4ff" font-family="sans-serif" font-size="11" font-weight="bold" letter-spacing="1">BALANCED</text>

  <!-- Analytics Simulation Component Right: Component Distribution Bars -->
  <g transform="translate(380, 160)">
    <!-- CPU Bar -->
    <text x="0" y="15" fill="#8b90a4" font-family="sans-serif" font-size="12" font-weight="600">INTEL CPU LOAD</text>
    <rect x="0" y="25" width="220" height="12" rx="6" fill="#1a1d26"/>
    <rect x="0" y="25" width="200" height="12" rx="6" fill="#00d4ff"/>
    
    <!-- GPU Bar -->
    <text x="0" y="70" fill="#8b90a4" font-family="sans-serif" font-size="12" font-weight="600">NVIDIA GPU LOAD</text>
    <rect x="0" y="80" width="220" height="12" rx="6" fill="#1a1d26"/>
    <rect x="0" y="80" width="215" height="12" rx="6" fill="#22d3a0"/>

    <!-- RAM Bar -->
    <text x="0" y="125" fill="#8b90a4" font-family="sans-serif" font-size="12" font-weight="600">SYSTEM MEMORY POOL</text>
    <rect x="0" y="135" width="220" height="12" rx="6" fill="#1a1d26"/>
    <rect x="0" y="135" width="95" height="12" rx="6" fill="#f5a524"/>
  </g>
</svg>
